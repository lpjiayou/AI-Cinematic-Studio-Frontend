name: Frontend CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CORE_PIN_SHA: e21789d265c4e936b0e0b29921746a4c205889b8
  CORE_PIN_TREE: 086f37ed4e5412d1d6608c4ee856ac75d61625e9

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate tracked Markdown files
        run: python scripts/validate_markdown.py

      - name: Validate local documentation links and anchors
        run: python scripts/validate_doc_links.py

      - name: Validate document registry coverage
        run: python scripts/validate_document_registry.py

      - name: Validate current-state projection and Core pins
        run: python scripts/validate_current_state.py

      - name: Validate document supersession and indexing
        run: python scripts/validate_document_supersession.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

  gate-c-k2-browser:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out Frontend candidate
        uses: actions/checkout@v4
        with:
          path: frontend
          persist-credentials: false

      - name: Check out pinned Core baseline
        uses: actions/checkout@v4
        with:
          repository: lpjiayou/AI-Cinematic-Studio
          ref: ${{ env.CORE_PIN_SHA }}
          path: core
          fetch-tags: true
          persist-credentials: false

      - name: Verify pinned Core baseline
        run: |
          test "$(git -C core rev-parse HEAD^{tree})" = "${{ env.CORE_PIN_TREE }}"
          test -z "$(git -C core status --porcelain=v1 --untracked-files=all)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deterministic media runtime
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes ffmpeg
          fi
          ffmpeg -version
          ffprobe -version

      - name: Install Frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install pinned browser harness
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm install --no-save --package-lock=false playwright@1.62.1
        working-directory: frontend

      - name: Build production Frontend
        run: npm run build
        working-directory: frontend

      - name: Execute real HTTP and Chromium Gate C
        env:
          K2_GATE_CORE_DIR: ${{ github.workspace }}/core
          K2_GATE_FRONTEND_DIR: ${{ github.workspace }}/frontend
          K2_GATE_ARTIFACT_ROOT: ${{ github.workspace }}/frontend/artifacts/gate-c-k2
          K2_GATE_FRONTEND_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          K2_GATE_BROWSER_CHANNEL: chrome
        run: npm run test:gate-c:k2
        working-directory: frontend

      - name: Upload Gate C evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k2-g7-gate-c-${{ github.sha }}
          path: frontend/artifacts/gate-c-k2
          if-no-files-found: error
          retention-days: 30

  gate-k2-control-plane-browser:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright

    steps:
      - name: Check out Frontend candidate
        uses: actions/checkout@v4
        with:
          path: frontend
          persist-credentials: false

      - name: Check out pinned Core baseline
        uses: actions/checkout@v4
        with:
          repository: lpjiayou/AI-Cinematic-Studio
          ref: ${{ env.CORE_PIN_SHA }}
          path: core
          fetch-tags: true
          persist-credentials: false

      - name: Verify pinned Core baseline
        run: |
          test "$(git -C core rev-parse HEAD^{tree})" = "${{ env.CORE_PIN_TREE }}"
          test -z "$(git -C core status --porcelain=v1 --untracked-files=all)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deterministic media runtime
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes ffmpeg
          fi
          ffmpeg -version
          ffprobe -version

      - name: Restore pinned Chromium cache
        uses: actions/cache@v4
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install pinned Chromium and system dependencies
        run: ./node_modules/.bin/playwright install --with-deps chromium
        working-directory: frontend

      - name: Execute real HTTP and Chromium control-plane gate
        env:
          K2_CONTROL_PLANE_CORE_DIR: ${{ github.workspace }}/core
          K2_CONTROL_PLANE_FRONTEND_DIR: ${{ github.workspace }}/frontend
          K2_CONTROL_PLANE_ARTIFACT_ROOT: ${{ github.workspace }}/frontend/artifacts/k2-control-plane-ci
        run: npm run test:gate-k2:control-plane
        working-directory: frontend

      - name: Upload control-plane gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k2-control-plane-browser-${{ github.sha }}
          path: frontend/artifacts/k2-control-plane-ci
          if-no-files-found: error
          retention-days: 30
