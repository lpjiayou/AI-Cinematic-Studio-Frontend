name: Frontend CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

  gate-c-k2-browser:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out Frontend candidate
        uses: actions/checkout@v4
        with:
          path: frontend

      - name: Check out exact Core candidate
        uses: actions/checkout@v4
        with:
          repository: lpjiayou/AI-Cinematic-Studio
          ref: ec9a4ac30382e1dceab3b82661fde927c35216cf
          path: core

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install pinned browser harness
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm install --no-save --package-lock=false playwright@1.62.1
        working-directory: frontend

      - name: Build production Frontend
        run: npm run build
        working-directory: frontend

      - name: Execute real HTTP and Chromium Gate C
        env:
          K2_GATE_CORE_DIR: ${{ github.workspace }}/core
          K2_GATE_FRONTEND_DIR: ${{ github.workspace }}/frontend
          K2_GATE_ARTIFACT_ROOT: ${{ github.workspace }}/frontend/artifacts/gate-c-k2
          K2_GATE_BROWSER_CHANNEL: chrome
        run: npm run test:gate-c:k2
        working-directory: frontend

      - name: Upload Gate C evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k2-g7-gate-c-${{ github.sha }}
          path: frontend/artifacts/gate-c-k2
          if-no-files-found: error
          retention-days: 30
